name: Validate lifecycle email action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-email-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest==8.4.1

      - name: Validate Python and YAML
        run: |
          python -m py_compile send_workflow_email.py
          ruby -e 'require "yaml"; YAML.load_file("action.yml", aliases: true); YAML.load_file(".github/workflows/ci.yml", aliases: true)'

      - name: Run unit tests
        run: python -m pytest -q
